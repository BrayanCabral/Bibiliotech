services:
  - type: web
    name: bibliotech
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_PASSWORD
        sync: false
      - key: BOOKS_DIR
        value: ./books
      - key: DATABASE_URL
        fromDatabase:
          name: bibliotech-db
          property: connectionString

databases:
  - name: bibliotech-db
    plan: free